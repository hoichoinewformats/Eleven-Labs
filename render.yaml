# Render Blueprint - https://render.com/docs/blueprint-spec
#
# WARNING: this file contains secrets in plaintext and is committed to git.
# Rotate all three credentials immediately after the first successful deploy:
#   - Neon password:   https://console.neon.tech (your project -> Roles -> reset)
#   - OpenRouter key:  https://openrouter.ai/keys (revoke + create new)
#   - ElevenLabs key:  https://elevenlabs.io/app/settings/api-keys
# After rotation, update the values either by editing this file (push triggers
# redeploy) or by overriding them in the Render dashboard's Environment tab.
#
# How to deploy:
#   1. Open https://dashboard.render.com/select-repo?type=blueprint
#   2. Connect the hoichoinewformats/eleven-labs repo.
#   3. Render reads this file. All env vars are pre-filled - just hit Apply.
#   4. ~3 min later you get https://logline-ai-backend.onrender.com.

services:
  - type: web
    name: logline-ai-backend
    runtime: node
    plan: free
    region: singapore # closest to your Neon ap-southeast-1 region
    branch: claude/script-character-voice-analyzer-KM0wP
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    preDeployCommand: npx prisma migrate deploy
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_H0nMfjz2Lmsl@ep-delicate-cloud-aofozm9i-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      - key: OPENROUTER_API_KEY
        value: "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"
      - key: ELEVENLABS_API_KEY
        value: "da58bf05346fe219826205b34ed17a040f6beab8001a696e5b93c939ec2aab33"
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat:free
